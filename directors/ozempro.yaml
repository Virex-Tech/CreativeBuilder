# DirectorProfile — OzemPro
# Regras de edição que valem para TODO criativo do app. O bloco `never` vence brief e referência.
# Contexto de produto, público e compliance completo: apps/ozempro/contexto.md
# Estrutura obrigatória do roteiro (30-40s, virada aos 10s, 3 funcionalidades): apps/ozempro/roteiro-ugc.md
director: ozempro_v1

pacing:
  cut_every_ms: [1200, 2200]    # público adulto em tratamento: claro > frenético
  hook_max_ms: 2500
  scene_min_ms: 900

transitions:
  allowed: [hard_cut, match_cut]
  forbidden: [crossfade, zoom_blur]

captions:
  style: karaoke_bold
  position: lower_third
  always_on: true               # som off é o default do feed
  max_words_on_screen: 3        # nunca mais que 3 palavras por vez
  font: Montserrat              # peso semibold — não usar extra bold
  stroke: soft_black_shadow     # sombra preta difusa, sem traço duro
  highlight: purple_word        # a palavra falada fica roxa; as outras, brancas

typography:
  hook: hook_stroke
  body: sub

camera:
  app_screen: [tilt_scroll, punch_in]
  generative: [handheld_subtle]

audio:
  music_energy: medium
  vo: { gender: female, age: adult, pace: medium }
  duck_db: -14

b_roll_policy:
  prefer: asset_library         # gerar é fallback, não padrão
  generate_if_missing: true

never:
  # compliance (regra da equipe) — detalhes em apps/ozempro/contexto.md
  - "nome completo do medicamento falado, escrito na tela ou na legenda (Mounjaro, Ozempic, Wegovy, Zepbound, tirzepatida...) — use moun moun, moun, tirze, canetinha, caneta, picadinha. Nos prints/gravações do app o nome pode aparecer"
  # produção
  - "texto renderizado dentro de imagem gerada por IA"
  - "tela do app gerada por IA"
  - "mais de 2 frases por cena"
