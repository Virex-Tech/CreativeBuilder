# DirectorProfile — OzemPro
# Regras de edição que valem para TODO criativo do app. O bloco `never` vence brief e referência.
# Contexto de produto, público e compliance completo: apps/ozempro/contexto.md
director: ozempro_v1

pacing:
  cut_every_ms: [1200, 2200]    # público adulto em tratamento: claro > frenético
  hook_max_ms: 2500
  scene_min_ms: 900

transitions:
  allowed: [hard_cut, match_cut]
  forbidden: [crossfade, zoom_blur]

captions:
  style: karaoke_bold
  position: lower_third
  max_chars_per_line: 26
  always_on: true               # som off é o default do feed

typography:
  hook: hook_stroke
  body: sub

camera:
  app_screen: [tilt_scroll, punch_in]
  generative: [handheld_subtle]

audio:
  music_energy: medium
  vo: { gender: female, age: adult, pace: medium }
  duck_db: -14

b_roll_policy:
  prefer: asset_library         # gerar é fallback, não padrão
  generate_if_missing: true

audience:
  min_age: 18                   # Meta e TikTok: saúde/peso só 18+

never:
  # compliance de anúncio — detalhes e fontes em apps/ozempro/contexto.md
  - "nome comercial de medicamento no vídeo (Ozempic, Wegovy, Mounjaro, Zepbound, Saxenda) — use 'tratamento com GLP-1' ou 'seu tratamento'"
  - "promessa de emagrecimento, quilos perdidos ou resultado garantido"
  - "antes e depois de corpo, foto de progresso em destaque ou close em barriga/partes do corpo"
  - "hook que afirma a condição de saúde de quem assiste ('você que toma...', 'tomando Ozempic?')"
  - "depoimento de pessoa sobre perda de peso"
  - "aplicação da injeção na pele, agulha em close ou caneta como protagonista do vídeo"
  - "sugerir dose, troca de medicamento ou uso sem médico"
  - "preço ou comparação de planos"
  - "texto renderizado dentro de imagem gerada por IA"
  - "tela do app gerada por IA"
  - "mais de 2 frases por cena"
  - "claim numérico sem fonte"
